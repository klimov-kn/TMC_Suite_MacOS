name: Вопрос по работе пакета
description: Не получается задать расчёт, непонятен формат файла или назначение параметра
labels: ["вопрос"]
body:
  - type: markdown
    attributes:
      value: |
        Перед тем как спрашивать, возможно, ответ уже есть:

        - [Справочник входного языка `.tpl`](https://www.tamic.ru/docs/user-manual/tpl-guide.html) —
          ключевые слова, примитивы, препроцессор, частотный свип, типичные ошибки;
        - [Руководства пользователя](https://www.tamic.ru/docs/user-manual/index.html) — по каждой программе,
          с описанием каждого окна;
        - [Инструкции по сборке](https://www.tamic.ru/docs/platforms/macos.html#build) — если вопрос о компиляции.

  - type: dropdown
    id: topic
    attributes:
      label: О чём вопрос
      options:
        - Составление файла задания .tpl
        - Запуск расчёта и его параметры
        - Просмотр результатов во вьюверах
        - Визуализация полей (FieldView)
        - Форматы выходных файлов
        - Сборка из исходников
        - Другое
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Вопрос
      description: Опишите, что пытаетесь сделать и на чём застряли.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: Что уже пробовали
      description: Помогает не советовать то, что вы уже проверили.

  - type: textarea
    id: tpl
    attributes:
      label: Файл задания, если вопрос о расчёте
      render: text
